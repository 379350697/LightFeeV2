symbols = ["BTCUSDT", "ETHUSDT"]

[runtime]
mode = "live"
opportunity_input_mode = "coarse_sidecar"
sidecar_snapshot_path = "runtime/opportunity-input-snapshot.json"
sidecar_snapshot_max_age_ms = 10000
sidecar_refresh_ms = 3000
sidecar_perp_liquidity_budget_ms = 30000
live_scan_last_good_max_age_ms = 600000
live_scan_recovery_success_count = 3
live_scan_revalidate_edge_buffer_bps = 2.0
poll_interval_ms = 3000
max_market_age_ms = 5000
private_position_max_age_ms = 15000
live_recovery_rest_probe_timeout_ms = 2000
max_order_quote_age_ms = 10000
uncertain_order_cooldown_ms = 30000
transfer_outage_warn_ms = 120000
transfer_backup_source_after_ms = 180000
transfer_outage_grace_ms = 600000
tick_failure_backoff_initial_ms = 1000
tick_failure_backoff_max_ms = 30000
ws_reconnect_initial_ms = 1000
ws_reconnect_max_ms = 30000
ws_unhealthy_after_failures = 5
journal_async_queue_capacity = 4096
auto_trade_enabled = true

[strategy]
entry_window_secs = 480
entry_local_l2_prewarm_window_secs = 480
entry_notional_cap_quote = 1000.0
live_entry_notional_cap_quote = 50.0
min_entry_leg_notional_quote = 8.0
max_concurrent_positions = 8
shadow_entry_opportunity_count = 2
max_single_venue_exposure_quote = 200.0
max_symbol_exposure_quote = 100.0
max_scan_minutes_before_funding = 35
min_scan_minutes_before_funding = 3
max_stagger_gap_minutes = 480
min_funding_edge_bps = 6.0
min_expected_edge_bps = 1.0
min_worst_case_edge_bps = 0.0
risk_monitor_enabled = false
execution_liquidity_enabled = true
max_entry_slippage_bps = 25.0
max_delever_slippage_bps = 50.0
entry_readiness_provider = "local_l2"  # local_l2 | rest_top_book | quote_lease | ws_top_book | ws_bbo_quote_lease
entry_quote_lease_ttl_ms = 1500
entry_ws_bbo_per_venue_budget = 10

[persistence]
event_log_path = "runtime/events.jsonl"
snapshot_path = "runtime/state.json"
tuning_diagnostics_enabled = true
tuning_diagnostics_max_records = 10000

[[venues]]
venue = "binance"
taker_fee_bps = 0.5
max_notional = 1000.0
[venues.live.trade_credentials]
api_key_env = "LIGHTFEE_BINANCE_API_KEY"
api_secret_env = "LIGHTFEE_BINANCE_API_SECRET"
permission_mode = "trade"

[[venues]]
venue = "okx"
taker_fee_bps = 0.5
max_notional = 1000.0
[venues.live.trade_credentials]
api_key_env = "LIGHTFEE_OKX_API_KEY"
api_secret_env = "LIGHTFEE_OKX_API_SECRET"
api_passphrase_env = "LIGHTFEE_OKX_API_PASSPHRASE"
permission_mode = "trade"

[[venues]]
venue = "bybit"
taker_fee_bps = 0.6
max_notional = 1000.0

