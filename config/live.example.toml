spread_allow_verified_maker_rebates = false
spread_paper_oos_start_ms = 0
spread_paper_require_out_of_sample = false
risk_monitor_enabled = true
execution_liquidity_enabled = true
max_entry_slippage_bps = 25.0
max_delever_slippage_bps = 50.0
entry_readiness_provider = "ws_bbo_l2_on_demand"  # legacy values migrate to this entry-only mode
entry_quote_lease_ttl_ms = 1500
entry_quote_prewarm_extra_candidate_count = 0
