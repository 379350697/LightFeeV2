symbols = ["BTCUSDT", "ETHUSDT"]

[runtime]
mode = "live"
sidecar_snapshot_path = "runtime/opportunity-input-snapshot.json"
sidecar_snapshot_max_age_ms = 30000
# Alert when broad-snapshot publication is slow; this does not block entry.
sidecar_snapshot_publish_warn_ms = 10000
# Broad multi-venue discovery, not final executable BBO/L2 evidence.
sidecar_market_observation_max_age_ms = 30000
sidecar_refresh_ms = 3000
# Persisted OI/24h-volume evidence is slow data, separate from BBO/L2 leases.
slow_evidence_max_age_ms = 600000
entry_open_interest_refresh_timeout_ms = 750
spread_sidecar_snapshot_path = "runtime/spread-opportunities-current.json"
spread_stats_checkpoint_path = "runtime/spread-stats-v2-checkpoint.json"
spread_sidecar_refresh_ms = 1000
spread_sidecar_fetch_timeout_s = 10.0
# One-way Local-L2 -> sidecar evidence bridge; no new public REST traffic.
local_l2_depth_bridge_enabled = true
local_l2_depth_bridge_path = "runtime/local-l2-depth-current.json"
local_l2_depth_bridge_max_levels = 20
local_l2_depth_bridge_publish_interval_ms = 500
live_scan_last_good_max_age_ms = 600000
live_scan_recovery_success_count = 3
live_scan_revalidate_edge_buffer_bps = 2.0
poll_interval_ms = 3000
maker_event_lane_enabled = true
maker_event_lane_min_wake_interval_ms = 40
max_market_age_ms = 5000
private_position_max_age_ms = 15000
live_recovery_rest_probe_timeout_ms = 2000
entry_account_truth_per_venue_timeout_ms = 2000
hyperliquid_info_coordinator_dir = "runtime/hyperliquid-info-coordinator"
max_order_quote_age_ms = 10000
uncertain_order_cooldown_ms = 30000
tick_failure_backoff_initial_ms = 1000
tick_failure_backoff_max_ms = 30000
ws_reconnect_initial_ms = 1000
ws_reconnect_max_ms = 60000
ws_unhealthy_after_failures = 5
journal_async_queue_capacity = 4096
auto_trade_enabled = true

[strategy]
entry_window_secs = 480
entry_local_l2_prewarm_window_secs = 480
entry_local_l2_primary_count = 6
post_funding_hold_secs = 300
entry_notional_cap_quote = 1000.0
live_entry_notional_cap_quote = 50.0
min_entry_leg_notional_quote = 8.0
max_concurrent_positions = 8
max_concurrent_positions_per_venue = 2
max_concurrent_positions_per_symbol = 1
max_concurrent_positions_per_venue_pair = 2
shadow_entry_opportunity_count = 2
primary_min_hold_ms = 15000
shadow_promotion_score_delta_bps = 3.0
# V1 live profile: only an unready Local-L2 primary may yield after this
# explicit lease. It never applies to BBO/OI/economics revalidation failures.
local_l2_scan_assignment_lease_enabled = true
local_l2_scan_assignment_lease_ttl_secs = 90
maker_entry_max_reposts = 1
maker_initial_slice_ratio = 0.5
maker_hedge_deadline_ms = 800
max_single_venue_exposure_quote = 200.0
max_symbol_exposure_quote = 100.0
max_scan_minutes_before_funding = 30
min_scan_minutes_before_funding = 3
max_stagger_gap_minutes = 480
max_top_book_usage_ratio = 0.95
min_funding_edge_bps = 6.0
min_expected_edge_bps = 1.2
min_worst_case_edge_bps = 0.6
funding_new_entries_enabled = false
funding_economics_mode = "v1_exact"
funding_forecast_mode = "shadow"
funding_forecast_uncertainty_haircut_bps = 2.0
funding_forecast_min_samples = 18
funding_forecast_shadow_min_days = 7
funding_forecast_stability_max_quantile_drift_bps = 2.0
funding_missing_margin_fallback_notional_quote = 15.0
funding_risk_health_buffer_ratio = 0.5
funding_max_venue_pair_exposure_quote = 0.0
funding_max_global_gross_exposure_quote = 0.0
funding_max_settlement_bucket_exposure_quote = 0.0
funding_settlement_crowding_bucket_ms = 300000
funding_max_correlation_group_exposure_quote = 0.0
funding_correlation_group_by_symbol = {}
spread_reversion_enabled = false
spread_live_enabled = false
spread_model_epoch = "v2_signed_reversion"
spread_live_notional_quote = 20.0
spread_max_gross_quote = 50.0
spread_max_concurrent_positions = 1
spread_min_samples = 120
spread_entry_z = 2.0
spread_exit_z = 0.5
spread_stop_z = 3.5
spread_min_net_edge_bps = 5.0
# Strict executable evidence budget. It is not used by paper/research samples.
spread_signal_ttl_ms = 1000
spread_quote_skew_ms = 250
# Main-sidecar research sample bounds; spread remains paper-only.
spread_research_quote_ttl_ms = 30000
spread_research_quote_skew_ms = 30000
spread_max_hold_ms = 1800000
spread_slippage_reserve_bps = 2.0
spread_adverse_selection_buffer_bps = 1.0
spread_expected_hold_ms = 1800000
spread_fair_price_max_venue_premium_bps = 150.0
spread_fair_price_min_venues = 3
spread_min_fair_price_confidence = 1.0
spread_single_venue_dislocation_enabled = false
spread_single_venue_dislocation_min_anchor_venues = 3
spread_min_liquidity_capacity_ratio = 1.25
spread_min_history_ms = 300000
spread_min_executable_spread_bps = 50.0
spread_max_executable_spread_bps = 300.0
# v3 replaces the fixed entry spread floor with a complete-cost multiple.
# Keep this disabled while v2 paper records are still being collected.
spread_dynamic_net_edge_enabled = false
spread_min_gross_profit_multiple = 1.0
spread_min_profit_buffer_bps = 5.0
spread_rank_by_capital_efficiency = false
spread_volatility_high_std_bps = 10.0
spread_mean_reversion_min_std_bps = 0.05
spread_mean_reversion_max_half_life_ms = 1800000
spread_stats_window_ms = 21600000
spread_stats_max_samples = 7200
spread_stats_short_window_ms = 900000
spread_structural_break_sigma = 3.0
spread_structural_break_consecutive = 5
spread_structural_break_cooldown_ms = 1800000
spread_ranker_max_candidates = 10
spread_score_liquidity_weight = 8.0
spread_score_z_cap = 5.0
spread_liquidity_small_quote = 50.0
spread_liquidity_medium_quote = 100.0
spread_liquidity_large_quote = 500.0
spread_liquidity_small_penalty_bps = 60.0
spread_liquidity_medium_penalty_bps = 30.0
spread_liquidity_sublarge_penalty_bps = 10.0
spread_paper_enabled = false
spread_paper_model_epoch = "v2_signed_reversion"
spread_paper_primary_fill_model = "taker_taker"
spread_paper_require_taker_taker = true
spread_paper_finalist_limit = 10
spread_paper_excluded_symbols = []
spread_paper_allowed_opportunity_labels = ["spread_reversion"]
spread_paper_episode_cooldown_ms = 1800000
spread_paper_bot_ids = ["tt_conservative"]
spread_paper_markout_secs = [60, 300, 900, 1800]
spread_paper_terminal_secs = 1800
spread_paper_slippage_buffer_bps = 0.0
spread_paper_latency_buffer_bps = 0.5
spread_paper_require_l2_vwap = true
risk_monitor_enabled = true
execution_liquidity_enabled = true
entry_sizing_mode = "liquidity_aware"
max_entry_slippage_bps = 25.0
max_delever_slippage_bps = 50.0
entry_readiness_provider = "ws_bbo_l2_on_demand"  # legacy values migrate to this entry-only mode
entry_quote_lease_ttl_ms = 1500
entry_quote_prewarm_extra_candidate_count = 0
entry_ws_bbo_per_venue_budget = 10
entry_quote_lease_max_skew_ms = 250

[persistence]
event_log_path = "runtime/events.jsonl"
spread_paper_event_log_path = "runtime/spread-paper-events.jsonl"
snapshot_path = "runtime/state.json"
tuning_diagnostics_enabled = true
tuning_diagnostics_max_records = 10000

