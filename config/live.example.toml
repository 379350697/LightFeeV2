shadow_entry_opportunity_count = 2
max_single_venue_exposure_quote = 200.0
max_symbol_exposure_quote = 100.0
max_scan_minutes_before_funding = 35
min_scan_minutes_before_funding = 3
max_stagger_gap_minutes = 480
min_funding_edge_bps = 6.0
min_expected_edge_bps = 1.0
min_worst_case_edge_bps = 0.0
funding_new_entries_enabled = false
funding_economics_mode = "v1_exact"
funding_forecast_mode = "shadow"
funding_forecast_uncertainty_haircut_bps = 2.0
funding_forecast_min_samples = 18
funding_forecast_shadow_min_days = 7
funding_forecast_stability_max_quantile_drift_bps = 2.0
funding_missing_margin_fallback_notional_quote = 15.0
funding_risk_health_buffer_ratio = 0.5
