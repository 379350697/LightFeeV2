funding_risk_health_buffer_ratio = 0.5
funding_max_venue_pair_exposure_quote = 0.0
funding_max_global_gross_exposure_quote = 0.0
funding_max_settlement_bucket_exposure_quote = 0.0
funding_settlement_crowding_bucket_ms = 300000
funding_max_correlation_group_exposure_quote = 0.0
